<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Reporte Rosarios</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #525659; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- Añadimos una marca de tiempo automática (?t=) para que el navegador SIEMPRE baje la versión fresca -->
    <script>
        var pdfUrl = "reporte.pdf?t=" + new Date().getTime();
        var iframe = document.createElement("iframe");
        iframe.src = pdfUrl;
        document.body.appendChild(iframe);
    </script>
</body>
</html>
